<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jean Elias — Dashboard de Leads</title>
<style>
  /* ==========================================================================
     TOKENS — paleta (ver dataviz skill). Todo el CSS se referencia por rol,
     así claro/oscuro cambian en un solo lugar.
     ========================================================================== */
  :root {
    color-scheme: light;
    --page:        #f9f9f7;
    --surface-1:   #fcfcfb;
    --surface-2:   #ffffff;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:    #e1e0d9;
    --baseline:    #c3c2b7;
    --border:      rgba(11,11,11,0.10);
    --series-1:    #2a78d6; /* azul — leads / serie primaria */
    --series-2:    #eb6834; /* naranja — ventas / serie secundaria */
    --series-3:    #1baf7a; /* aqua — plan más vendido */
    --series-4:    #eda100; /* amarillo */
    --series-5:    #e87ba4; /* magenta */
    --series-6:    #008300; /* verde */
    --series-7:    #4a3aa7; /* violeta */
    --good:        #0ca30c;
    --seq-100:     #cde2fb;
    --seq-400:     #3987e5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page:        #0d0d0d;
      --surface-1:   #1a1a19;
      --surface-2:   #201f1e;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:    #2c2c2a;
      --baseline:    #383835;
      --border:      rgba(255,255,255,0.10);
      --series-1:    #3987e5;
      --series-2:    #d95926;
      --series-3:    #199e70;
      --series-4:    #c98500;
      --series-5:    #d55181;
      --series-6:    #008300;
      --series-7:    #9085e9;
      --good:        #0ca30c;
      --seq-100:     #184f95;
      --seq-400:     #3987e5;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:        #0d0d0d;
    --surface-1:   #1a1a19;
    --surface-2:   #201f1e;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:    #2c2c2a;
    --baseline:    #383835;
    --border:      rgba(255,255,255,0.10);
    --series-1:    #3987e5;
    --series-2:    #d95926;
    --series-3:    #199e70;
    --series-4:    #c98500;
    --series-5:    #d55181;
    --series-6:    #008300;
    --series-7:    #9085e9;
    --good:        #0ca30c;
    --seq-100:     #184f95;
    --seq-400:     #3987e5;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 24px 20px 64px; }

  header.top {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 20px;
  }
  header.top h1 { font-size: 22px; margin: 0; }
  header.top .sub { color: var(--text-secondary); font-size: 13px; margin-top: 4px; }
  header.top .meta { color: var(--text-muted); font-size: 12px; margin-top: 4px; }
  .top-actions { display: flex; align-items: center; gap: 8px; }
  button.icon-btn {
    background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text-primary); border-radius: 8px; padding: 8px 12px;
    font-size: 13px; cursor: pointer;
  }
  button.icon-btn:hover { border-color: var(--text-muted); }

  /* Filtros */
  .filters {
    display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-end;
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px; margin-bottom: 22px;
  }
  .filters .field { display: flex; flex-direction: column; gap: 4px; }
  .filters label { font-size: 12px; color: var(--text-secondary); }
  .filters select {
    background: var(--surface-2); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px;
    font-size: 13px; min-width: 140px;
  }

  section.block { margin-bottom: 30px; }
  section.block h2 {
    font-size: 15px; font-weight: 700; color: var(--text-primary);
    display: inline; margin: 0;
  }
  section.block .h2-row { margin-bottom: 12px; }
  section.block .h2-note { font-size: 12px; color: var(--text-muted); margin-left: 6px; }

  /* Stat tiles */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .tile {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px;
  }
  .tile .label { font-size: 12px; color: var(--text-secondary); }
  .tile .value { font-size: 24px; font-weight: 600; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .tile .hint { font-size: 11px; color: var(--text-muted); margin-top: 3px; }

  .chart-card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 18px;
  }
  .legend { display: flex; gap: 16px; justify-content: center; margin-bottom: 10px; font-size: 12px; color: var(--text-secondary); }
  .legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

  /* Donut + leyenda (tipificaciones) */
  .donut-wrap { display: grid; grid-template-columns: 220px 1fr; gap: 24px; align-items: center; }
  @media (max-width: 640px) { .donut-wrap { grid-template-columns: 1fr; } }
  .donut-legend .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--gridline); font-size: 12px; }
  .donut-legend .row:last-child { border-bottom: none; }
  .donut-legend .name { display: flex; align-items: center; gap: 8px; text-transform: uppercase; color: var(--text-secondary); letter-spacing: .01em; }
  .donut-legend .sq { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .donut-legend .num { color: var(--text-primary); white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* Ranking horizontal (asesores) */
  .rank-chart-row { display: grid; grid-template-columns: 150px 1fr; align-items: center; gap: 10px; padding: 5px 0; }
  .rank-chart-row .name { font-size: 13px; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-track { background: var(--gridline); border-radius: 4px; height: 14px; overflow: hidden; }
  .rank-fill { height: 100%; border-radius: 4px; background: var(--series-1); }
  .rank-axis-row { display: grid; grid-template-columns: 150px 1fr; margin-top: 6px; }
  .rank-axis-track { position: relative; height: 16px; }
  .rank-axis-track span { position: absolute; top: 0; font-size: 10px; color: var(--text-muted); }

  /* Tablas */
  table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data-table th, table.data-table td {
    text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--gridline); white-space: nowrap;
  }
  table.data-table th:first-child, table.data-table td:first-child,
  table.data-table th.txt, table.data-table td.txt { text-align: left; }
  table.data-table th { color: var(--text-secondary); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .02em; }
  table.data-table td { font-variant-numeric: tabular-nums; }
  table.data-table tbody tr:hover { background: var(--surface-2); }
  table.data-table td.rank-num { font-weight: 700; color: var(--text-muted); text-align: center; }
  table.data-table tr.first td.rank-num { color: var(--good); }
  table.data-table td.col-ventas { font-weight: 700; color: var(--text-primary); }
  table.data-table tfoot tr.total-row td { font-weight: 700; border-top: 2px solid var(--border); border-bottom: none; background: var(--surface-2); }

  .empty-state {
    text-align: center; padding: 60px 20px; color: var(--text-secondary);
    background: var(--surface-1); border: 1px dashed var(--border); border-radius: 12px;
  }
  .empty-state .big { font-size: 15px; color: var(--text-primary); margin-bottom: 6px; }
  .empty-state .small { font-size: 13px; }
  .empty-state.inline { padding: 24px; }

  footer.note {
    margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    font-size: 12px; color: var(--text-muted);
  }

  /* Tooltip al pasar el cursor sobre barras / dona / ranking */
  .chart-tooltip {
    position: fixed; z-index: 1000; pointer-events: none;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 10px; font-size: 12px; color: var(--text-primary);
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    opacity: 0; transform: translateY(2px); transition: opacity .08s ease;
    white-space: pre-line; max-width: 280px; line-height: 1.4; font-weight: 600;
  }
  .chart-tooltip.visible { opacity: 1; }
  svg rect, svg circle, .rank-fill, .rank-track { cursor: default; }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1>📊 Dashboard de Gestión — Meta &amp; TikTok</h1>
      <div class="sub">Leads, ventas y efectividad del equipo, en vivo desde el Google Sheet de Jean Elias</div>
      <div class="meta" id="header-meta">—</div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="btn-refresh" title="Actualizar datos">↻ Actualizar</button>
      <button class="icon-btn" id="btn-theme" title="Cambiar tema">🌓 Tema</button>
    </div>
  </header>

  <div class="filters">
    <div class="field"><label for="f-plataforma">Plataforma</label><select id="f-plataforma"></select></div>
    <div class="field"><label for="f-mes">Mes</label><select id="f-mes"></select></div>
    <div class="field"><label for="f-asesor">Asesor</label><select id="f-asesor"></select></div>
  </div>

  <div id="content"></div>

  <footer class="note">
    <span>Fuente: Google Sheet de Jean Elias (pestañas de leads Meta/TikTok + resumen de inversión) · no incluye Base Fría.</span>
    <span id="footer-update">—</span>
  </footer>
</div>

<div class="chart-tooltip" id="chart-tooltip"></div>

<script>
/* ============================================================================
   CONFIG — nombres de campos que entrega el backend (Apps Script -> JSON).
   Si algún día cambia el esquema, se ajusta solo aquí.
   ============================================================================ */
const CONFIG = {
  // Endpoint del Apps Script de Team Jean Elias (propio, no compartido con otros equipos).
  DATA_URL: 'https://script.google.com/macros/s/AKfycbxA3OtKTuSI7CHMSjxDBRoZrXYxV72B-DNcQ9hrkkWEfZyNqy2gT3T0EojwFrBJa8ea/exec',
  DATA_TOKEN: '7ebab45d2d214caf83e8f1cffb00471a9750e642c9054ce9b9f157a366bd5485',
  MESES: ['', 'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'],
};

let RAW_LEADS = [];   // tal cual llega del backend
let META = { generated_at: null };
let RESUMEN = { meta: null, tiktok: null }; // totales de inversión/CPL/CPA (no se filtran por mes/asesor)
let RESUMEN_MENSUAL = { meta: [], tiktok: [] }; // inversión/leads por mes, uno x plataforma (viene de los bloques "Leads {Plataforma} {Mes}" en RESUMEN META/TIKTOK)

/* ============================================================================
   CARGA / NORMALIZACIÓN
   ============================================================================ */
async function loadData() {
  const url = CONFIG.DATA_URL + '?token=' + encodeURIComponent(CONFIG.DATA_TOKEN) + '&t=' + Date.now();
  let res;
  try {
    res = await fetch(url);
  } catch (networkErr) {
    throw new Error('No se pudo conectar con la fuente de datos. Revisa tu conexión a internet e intenta de nuevo con el botón "Actualizar".');
  }
  if (!res.ok) {
    throw new Error('La fuente de datos respondió con un error (código ' + res.status + '). Intenta de nuevo en un momento.');
  }
  const json = await res.json();
  if (json.ok === false) {
    throw new Error(json.error || 'La fuente de datos devolvió un error.');
  }
  RAW_LEADS = Array.isArray(json.leads) ? json.leads : [];
  META.generated_at = json.generated_at || null;
  RESUMEN = json.resumen || { meta: null, tiktok: null };
  RESUMEN_MENSUAL = json.resumen_mensual || { meta: [], tiktok: [] };

  const fecha = META.generated_at
    ? new Date(META.generated_at).toLocaleString('es-PE', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' })
    : null;
  const metaText = fecha ? ('Actualizado: ' + fecha + ' · ' + RAW_LEADS.length.toLocaleString('es-PE') + ' leads cargados') : 'Sin datos aún';
  document.getElementById('header-meta').textContent = metaText;
  document.getElementById('footer-update').textContent = fecha ? ('Última carga: ' + fecha) : '—';
}

function asText(value) {
  if (value === null || value === undefined) return '';
  return String(value).trim();
}

function normalize(lead) {
  return {
    plataforma: asText(lead.plataforma).toLowerCase(),
    asesor: asText(lead.asesor) || 'Sin asignar',
    supervisor: asText(lead.supervisor),
    mes: asText(lead.mes),
    anio: asText(lead.anio),
    status_gestion: asText(lead.status_gestion).toUpperCase(),
    tipificacion: asText(lead.tipificacion),
    plan_vendido: asText(lead.plan_vendido),
    qty_venta: Number(lead.qty_venta) > 0 ? Number(lead.qty_venta) : 0,
  };
}

/* ============================================================================
   FILTROS
   ============================================================================ */
function uniqueSorted(arr) {
  return [...new Set(arr)].filter(Boolean).sort();
}

function populateFilters(leads) {
  const plataformas = uniqueSorted(leads.map(l => l.plataforma));
  const asesores = uniqueSorted(leads.map(l => l.asesor));
  const meses = uniqueSorted(leads.filter(l => l.anio && l.mes).map(l => l.anio + '-' + String(l.mes).padStart(2, '0')));

  fillSelect('f-plataforma', ['todas', ...plataformas], v => v === 'todas' ? 'Todas' : v.toUpperCase());
  fillSelect('f-asesor', ['todos', ...asesores], v => v === 'todos' ? 'Todos' : v);
  fillSelect('f-mes', ['todos', ...meses], v => {
    if (v === 'todos') return 'Todos';
    const [y, m] = v.split('-');
    return CONFIG.MESES[Number(m)] + ' ' + y;
  });
}

function fillSelect(id, values, labelFn) {
  const el = document.getElementById(id);
  const prev = el.value;
  el.innerHTML = '';
  values.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = labelFn(v);
    el.appendChild(opt);
  });
  if (values.includes(prev)) el.value = prev;
}

function applyFilters(leads) {
  const plat = document.getElementById('f-plataforma').value;
  const mes = document.getElementById('f-mes').value;
  const asesor = document.getElementById('f-asesor').value;
  return leads.filter(l => {
    if (plat && plat !== 'todas' && l.plataforma !== plat) return false;
    if (asesor && asesor !== 'todos' && l.asesor !== asesor) return false;
    if (mes && mes !== 'todos') {
      const key = l.anio + '-' + String(l.mes).padStart(2, '0');
      if (key !== mes) return false;
    }
    return true;
  });
}

/* ============================================================================
   HELPERS DE CÁLCULO (compartidos por resumen general / mes / asesor)
   ============================================================================ */
function pct(a, b) { return b ? (a / b * 100) : 0; }

function summarize(leads) {
  const leadsN = leads.length;
  const gestionados = leads.filter(l => l.status_gestion !== '').length;
  const contacto = leads.filter(l => l.status_gestion === 'CONTACTO').length;
  const ventas = leads.filter(l => l.qty_venta > 0).length;       // clientes / eventos de venta
  const unidades = leads.reduce((s, l) => s + l.qty_venta, 0);    // líneas vendidas (multi cuenta)
  return {
    leads: leadsN, gestionados, contacto, ventas, unidades,
    pctGestion: pct(gestionados, leadsN),
    pctContacto: pct(contacto, gestionados),
    cvr: pct(ventas, leadsN),
    efectGestion: pct(ventas, gestionados),
    vendidoContacto: pct(ventas, contacto),
  };
}

// Tipificación exacta que usa el equipo para marcar un lead como agendado
// (tal cual aparece en la columna "estaus" del Sheet).
const TIPI_AGENDADO = 'CLIENTE AGENDADO (NO TOCAR)';

// Desglose más detallado por asesor — la base es summarize() (mismos números
// que el ranking), y se le suma No Contacto / Agendados / Ventas Mono /
// Ventas Multi / QTY Ventas Multi, para el cuadro de "Análisis por asesor".
function analisisAsesor(leads) {
  const s = summarize(leads);
  const noContacto = leads.filter(l => l.status_gestion === 'NO CONTACTO').length;
  const agendados = leads.filter(l => l.tipificacion === TIPI_AGENDADO).length;
  const ventasMono = leads.filter(l => l.tipificacion === 'VENTA MONO').length;
  const multiLeads = leads.filter(l => l.tipificacion === 'VENTA MULTI');
  const ventasMulti = multiLeads.length;
  const qtyVentasMulti = multiLeads.reduce((sum, l) => sum + l.qty_venta, 0);
  return {
    ...s,
    noContacto, agendados, ventasMono, ventasMulti, qtyVentasMulti,
    cvrUnidades: pct(s.unidades, s.gestionados),
    hrUnidades: pct(s.unidades, s.contacto),
  };
}

/* ============================================================================
   MÉTRICAS
   ============================================================================ */
function computeMetrics(leads) {
  const g = summarize(leads);

  // Resumen mensual (excluye leads sin fecha válida — se cuentan aparte)
  const conFecha = leads.filter(l => l.anio && l.mes);
  const sinFecha = leads.length - conFecha.length;
  const monthKeys = uniqueSorted(conFecha.map(l => l.anio + '-' + String(l.mes).padStart(2, '0')));
  const porMes = monthKeys.map(key => {
    const [y, m] = key.split('-');
    const monthLeads = conFecha.filter(l => (l.anio + '-' + String(l.mes).padStart(2, '0')) === key);
    return { key, label: CONFIG.MESES[Number(m)] + ' ' + y, ...summarize(monthLeads) };
  });

  // Tipificaciones — solo de leads gestionados, top 7 + "Otras"
  const gestLeads = leads.filter(l => l.status_gestion !== '');
  const tipiMap = {};
  gestLeads.forEach(l => {
    const key = l.tipificacion || '(sin tipificar)';
    tipiMap[key] = (tipiMap[key] || 0) + 1;
  });
  const tipiSorted = Object.entries(tipiMap).map(([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count);
  const tipiTop = tipiSorted.slice(0, 7);
  const tipiRestCount = tipiSorted.slice(7).reduce((s, t) => s + t.count, 0);
  const tipiBase = gestLeads.length;
  const TIPI_COLORS = ['var(--series-1)', 'var(--series-2)', 'var(--series-3)', 'var(--series-4)', 'var(--series-5)', 'var(--series-6)', 'var(--series-7)'];
  const tipificaciones = tipiTop.map((t, i) => ({ ...t, color: TIPI_COLORS[i], pct: pct(t.count, tipiBase) }));
  if (tipiRestCount > 0) tipificaciones.push({ name: 'Otras', count: tipiRestCount, color: 'var(--text-muted)', pct: pct(tipiRestCount, tipiBase) });

  // Plan más vendido — solo leads con venta
  const ventaLeads = leads.filter(l => l.qty_venta > 0);
  const planMap = {};
  ventaLeads.forEach(l => {
    const key = l.plan_vendido || '(sin especificar)';
    if (!planMap[key]) planMap[key] = { name: key, ventas: 0, unidades: 0 };
    planMap[key].ventas += 1;
    planMap[key].unidades += l.qty_venta;
  });
  const totalVentasPlan = ventaLeads.length;
  const planes = Object.values(planMap)
    .map(p => ({ ...p, pct: pct(p.ventas, totalVentasPlan) }))
    .sort((a, b) => b.ventas - a.ventas)
    .slice(0, 8);

  // Ranking asesores
  const asesorMap = {};
  leads.forEach(l => {
    if (!asesorMap[l.asesor]) asesorMap[l.asesor] = { asesor: l.asesor, supervisores: new Set(), leads: [] };
    asesorMap[l.asesor].leads.push(l);
    if (l.supervisor) asesorMap[l.asesor].supervisores.add(l.supervisor);
  });
  const ranking = Object.values(asesorMap)
    .map(a => {
      const s = summarize(a.leads);
      const supervisor = a.supervisores.size === 0 ? '—' : (a.supervisores.size === 1 ? [...a.supervisores][0] : 'Varios');
      return { asesor: a.asesor, supervisor, ...s };
    })
    .sort((a, b) => b.ventas - a.ventas);

  // Análisis por asesor — mismo desglose, pero con No Contacto / Agendados /
  // Ventas Mono / Ventas Multi / QTY Ventas Multi, y % CVR y % HR calculados
  // sobre unidades vendidas (igual que el cuadro de referencia).
  const analisisAsesores = Object.values(asesorMap)
    .map(a => ({ asesor: a.asesor, ...analisisAsesor(a.leads) }))
    .sort((a, b) => b.unidades - a.unidades);
  const totalAnalisis = analisisAsesor(leads);

  return { ...g, sinFecha, porMes, tipificaciones, planes, ranking, analisisAsesores, totalAnalisis };
}

// Inversión/CPL/CPA (totales) vienen del bloque general de las pestañas
// "RESUMEN META"/"RESUMEN TIKTOK". Respeta el filtro de Plataforma. El
// desglose mes a mes vive en RESUMEN_MENSUAL (ver computeInversionMensual).
function computeInversion() {
  const plat = document.getElementById('f-plataforma').value;
  const fuentes = [];
  if ((plat === 'todas' || plat === 'meta') && RESUMEN.meta) fuentes.push(RESUMEN.meta);
  if ((plat === 'todas' || plat === 'tiktok') && RESUMEN.tiktok) fuentes.push(RESUMEN.tiktok);
  if (fuentes.length === 0) return null;

  const inversion = fuentes.reduce((s, f) => s + (f.inversion || 0), 0);
  const leads = fuentes.reduce((s, f) => s + (f.leads || 0), 0);
  const unidades = fuentes.reduce((s, f) => s + (f.qty_ventas || f.ventas || 0), 0);
  return { inversion, cpl: leads ? inversion / leads : 0, cpa: unidades ? inversion / unidades : 0 };
}

// Inversión mensual por plataforma — viene de los bloques "Leads {Plataforma}
// {Mes}" que ya existen en las pestañas RESUMEN META / RESUMEN TIKTOK del
// Sheet. Respeta el filtro de Plataforma; no se filtra por mes ni asesor
// porque acá el objetivo es ver la serie completa mes a mes.
function computeInversionMensual() {
  const plat = document.getElementById('f-plataforma').value;
  const mapa = {};
  const acumular = (arr, key) => {
    (arr || []).forEach(item => {
      const nombre = item.mes_nombre;
      if (!nombre) return;
      if (!mapa[nombre]) mapa[nombre] = { mes_nombre: nombre, meta: 0, tiktok: 0 };
      mapa[nombre][key] += Number(item.inversion) || 0;
    });
  };
  if (plat === 'todas' || plat === 'meta') acumular(RESUMEN_MENSUAL.meta, 'meta');
  if (plat === 'todas' || plat === 'tiktok') acumular(RESUMEN_MENSUAL.tiktok, 'tiktok');

  const ordenMes = {};
  CONFIG.MESES.forEach((nombre, i) => { if (nombre) ordenMes[nombre] = i; });

  return Object.values(mapa)
    .map(r => ({ ...r, total: r.meta + r.tiktok }))
    .sort((a, b) => (ordenMes[a.mes_nombre] || 0) - (ordenMes[b.mes_nombre] || 0));
}

/* ============================================================================
   GRÁFICOS (SVG, se re-generan en cada render)
   ============================================================================ */
function pctFmt(n) { return n.toFixed(1) + '%'; }

function niceTicks(maxValue, targetCount) {
  if (maxValue <= 0) return { max: 1, ticks: [0, 1] };
  const rawStep = maxValue / targetCount;
  const magnitude = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const residual = rawStep / magnitude;
  let step;
  if (residual > 5) step = 10 * magnitude;
  else if (residual > 2) step = 5 * magnitude;
  else if (residual > 1) step = 2 * magnitude;
  else step = magnitude;
  const max = Math.ceil(maxValue / step) * step;
  const ticks = [];
  for (let v = 0; v <= max + 1e-9; v += step) ticks.push(Math.round(v));
  return { max, ticks };
}

function monthlyChartSvg(porMes) {
  const W = 900, H = 260, ML = 56, MR = 10, MT = 10, MB = 34;
  const plotW = W - ML - MR, plotH = H - MT - MB;
  const maxVal = Math.max(1, ...porMes.map(r => Math.max(r.leads, r.ventas)));
  const { max: axisMax, ticks } = niceTicks(maxVal, 6);
  const n = Math.max(porMes.length, 1);
  const groupW = plotW / n;
  const barW = Math.min(24, groupW * 0.3);
  const gap = 6;

  let grid = '';
  ticks.forEach(t => {
    const gy = MT + plotH - (t / axisMax) * plotH;
    grid += `<line x1="${ML}" x2="${W - MR}" y1="${gy.toFixed(1)}" y2="${gy.toFixed(1)}" stroke="var(--gridline)" stroke-width="1"/>`;
    grid += `<text x="${ML - 8}" y="${(gy + 3).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--text-muted)">${t.toLocaleString('es-PE')}</text>`;
  });

  let bars = '', labels = '';
  porMes.forEach((r, i) => {
    const cx = ML + i * groupW + groupW / 2;
    const xLeads = cx - gap / 2 - barW;
    const xVentas = cx + gap / 2;
    const hLeads = (r.leads / axisMax) * plotH;
    const hVentas = (r.ventas / axisMax) * plotH;
    const tipLeads = escJs(`${r.label}\nLeads ingresados: ${r.leads.toLocaleString('es-PE')}`);
    const tipVentas = escJs(`${r.label}\nVentas: ${r.ventas.toLocaleString('es-PE')}\nCVR: ${pctFmt(r.cvr)}`);
    bars += `<rect x="${xLeads.toFixed(1)}" y="${(MT + plotH - hLeads).toFixed(1)}" width="${barW.toFixed(1)}" height="${hLeads.toFixed(1)}" fill="var(--series-1)" rx="2" onmouseenter="showTip(event,'${tipLeads}')" onmousemove="moveTip(event)" onmouseleave="hideTip()"/>`;
    bars += `<rect x="${xVentas.toFixed(1)}" y="${(MT + plotH - hVentas).toFixed(1)}" width="${barW.toFixed(1)}" height="${hVentas.toFixed(1)}" fill="var(--series-2)" rx="2" onmouseenter="showTip(event,'${tipVentas}')" onmousemove="moveTip(event)" onmouseleave="hideTip()"/>`;
    labels += `<text x="${cx.toFixed(1)}" y="${H - 10}" text-anchor="middle" font-size="11" fill="var(--text-muted)">${escapeHtml(r.label)}</text>`;
  });

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${grid}${bars}${labels}</svg>`;
}

function planBarSvg(planes) {
  const W = 700, H = 210, ML = 46, MR = 10, MT = 10, MB = 30;
  const plotW = W - ML - MR, plotH = H - MT - MB;
  const maxVal = Math.max(1, ...planes.map(p => p.ventas));
  const { max: axisMax, ticks } = niceTicks(maxVal, 5);
  const n = Math.max(planes.length, 1);
  const slotW = plotW / n;
  const barW = Math.min(64, slotW * 0.5);

  let grid = '';
  ticks.forEach(t => {
    const gy = MT + plotH - (t / axisMax) * plotH;
    grid += `<line x1="${ML}" x2="${W - MR}" y1="${gy.toFixed(1)}" y2="${gy.toFixed(1)}" stroke="var(--gridline)" stroke-width="1"/>`;
    grid += `<text x="${ML - 8}" y="${(gy + 3).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--text-muted)">${t.toLocaleString('es-PE')}</text>`;
  });

  let bars = '', labels = '';
  planes.forEach((p, i) => {
    const cx = ML + i * slotW + slotW / 2;
    const h = (p.ventas / axisMax) * plotH;
    const tipPlan = escJs(`${p.name}\nVentas (clientes): ${p.ventas.toLocaleString('es-PE')} (${pctFmt(p.pct)})\nUnidades: ${p.unidades.toLocaleString('es-PE')}`);

    labels += `<text x="${cx.toFixed(1)}" y="${H - 10}" text-anchor="middle" font-size="11" fill="var(--text-muted)">${escapeHtml(p.name)}</text>`;
  });

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${grid}${bars}${labels}</svg>`;
}

function donutSvg(segments) {
  const r = 70, cx = 100, cy = 100, sw = 34;
  const circumference = 2 * Math.PI * r;
  const total = segments.reduce((s, seg) => s + seg.count, 0) || 1;
  let offset = 0;
  const circles = segments.map(seg => {
    const len = (seg.count / total) * circumference;
    const dasharray = `${len.toFixed(2)} ${(circumference - len).toFixed(2)}`;
    const dashoffset = (-offset).toFixed(2);
    offset += len;
    const tipSeg = escJs(`${seg.name}\n${seg.count.toLocaleString('es-PE')} · ${pctFmt(seg.pct)}`);
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${sw}" stroke-dasharray="${dasharray}" stroke-dashoffset="${dashoffset}" onmouseenter="showTip(event,'${tipSeg}')" onmousemove="moveTip(event)" onmouseleave="hideTip()"/>`;
  }).join('');
  return `<svg viewBox="0 0 200 200" style="width:100%;max-width:220px;height:auto;display:block;margin:0 auto">
    <g transform="rotate(-90 ${cx} ${cy})">${circles}</g>
  </svg>`;
}

              <tr onmouseenter="showTip(event,'${escJs(`${a.asesor}\nGestión.: ${a.gestionados.toLocaleString('es-PE')}   No Contacto: ${a.noContacto.toLocaleString('es-PE')}   Contacto: ${a.contacto.toLocaleString('es-PE')}\nAgendados: ${a.agendados.toLocaleString('es-PE')}\nVenta Mono: ${a.ventasMono.toLocaleString('es-PE')}   Venta Multi: ${a.ventasMulti.toLocaleString('es-PE')} (${a.qtyVentasMulti.toLocaleString('es-PE')} unid.)\nVentas: ${a.unidades.toLocaleString('es-PE')} unid. · CVR ${pctFmt(a.cvrUnidades)} · HR ${pctFmt(a.hrUnidades)}`)}')" onmousemove="moveTip(event)" onmouseleave="hideTip()">
                <td class="txt">${escapeHtml(a.asesor)}</td>
                <td>${a.gestionados.toLocaleString('es-PE')}</td>
                <td>${a.noContacto.toLocaleString('es-PE')}</td>
                <td>${a.agendados.toLocaleString('es-PE')}</td>
                <td>${a.contacto.toLocaleString('es-PE')}</td>
                <td>${a.ventasMono.toLocaleString('es-PE')}</td>
                <td>${a.ventasMulti.toLocaleString('es-PE')}</td>
                <td>${a.qtyVentasMulti.toLocaleString('es-PE')}</td>
                <td class="col-ventas">${a.unidades.toLocaleString('es-PE')}</td>
                <td>${pctFmt(a.cvrUnidades)}</td>
                <td>${pctFmt(a.hrUnidades)}</td>
              </tr>`).join('')}
          </tbody>
          <tfoot>
            <tr class="total-row">
              <td class="txt">Total equipo</td>
              <td>${m.totalAnalisis.gestionados.toLocaleString('es-PE')}</td>
              <td>${m.totalAnalisis.noContacto.toLocaleString('es-PE')}</td>
              <td>${m.totalAnalisis.agendados.toLocaleString('es-PE')}</td>
              <td>${m.totalAnalisis.contacto.toLocaleString('es-PE')}</td>
              <td>${m.totalAnalisis.ventasMono.toLocaleString('es-PE')}</td>
              <td>${m.totalAnalisis.ventasMulti.toLocaleString('es-PE')}</td>
              <td>${m.totalAnalisis.qtyVentasMulti.toLocaleString('es-PE')}</td>
              <td class="col-ventas">${m.totalAnalisis.unidades.toLocaleString('es-PE')}</td>
              <td>${pctFmt(m.totalAnalisis.cvrUnidades)}</td>
              <td>${pctFmt(m.totalAnalisis.hrUnidades)}</td>
            </tr>
          </tfoot>
        </table>
      </div>
      <div class="chart-card empty-state small inline" style="margin-top:10px; text-align:left; padding:14px 16px">
        <strong>¿Qué significa cada columna?</strong> Gestión. = leads con algún resultado de gestión. No Contacto / Contacto = según "Status Gestión". Agendados = tipificados como "${escapeHtml(TIPI_AGENDADO)}". Ventas Mono/Multi = tipificados como "VENTA MONO"/"VENTA MULTI". QTY V. Multi = cuentas vendidas en esas ventas multi. Ventas = unidades totales vendidas (Mono + QTY V. Multi). % CVR = Ventas / Gestión. % HR = Ventas / Contacto.
      </div>` : '<div class="chart-card empty-state small inline">Sin datos en el rango seleccionado</div>'}
    </section>
  `;
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================================================================
   TOOLTIP — al pasar el cursor sobre una barra / porción de la dona / fila
   del ranking, muestra el dato exacto (igual que en el dashboard de Team 1).
   El contenido se arma con textContent (no innerHTML), así que no hay riesgo
   de que un nombre raro (con < > & etc.) rompa el tooltip.
   ============================================================================ */
function escJs(str) {
  // Escapa el texto para poder meterlo dentro de un atributo HTML
  // (onmouseenter="...") que a su vez arma un string de JS con comillas simples.
  return String(str)
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/\n/g, '\\n')
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;');
}

function showTip(evt, text) {
  const tip = document.getElementById('chart-tooltip');
  if (!tip) return;
  tip.textContent = text;
  tip.classList.add('visible');
  moveTip(evt);
}

function moveTip(evt) {
  const tip = document.getElementById('chart-tooltip');
  if (!tip) return;
  const pad = 14;
  const vw = window.innerWidth, vh = window.innerHeight;
  const rect = tip.getBoundingClientRect();
  let x = evt.clientX + pad;
  let y = evt.clientY + pad;
  if (x + rect.width > vw - 8) x = evt.clientX - rect.width - pad;
  if (y + rect.height > vh - 8) y = evt.clientY - rect.height - pad;
  tip.style.left = Math.max(4, x) + 'px';
  tip.style.top = Math.max(4, y) + 'px';
}

function hideTip() {
  const tip = document.getElementById('chart-tooltip');
  if (tip) tip.classList.remove('visible');
}

/* ============================================================================
   INIT
   ============================================================================ */
document.getElementById('f-plataforma').addEventListener('change', render);
document.getElementById('f-mes').addEventListener('change', render);
document.getElementById('f-asesor').addEventListener('change', render);

function showLoadError(err) {
  document.getElementById('content').innerHTML = `<div class="empty-state">
    <div class="big">No se pudo cargar la información</div>
    <div class="small">${escapeHtml(err && err.message ? err.message : String(err))}</div>
  </div>`;
  document.getElementById('header-meta').textContent = 'Error al cargar datos';
}

async function refreshAndRender() {
  try {
    await loadData();
    populateFilters(RAW_LEADS.map(normalize));
    render();
  } catch (err) {
    showLoadError(err);
  }
}

document.getElementById('btn-refresh').addEventListener('click', refreshAndRender);

document.getElementById('btn-theme').addEventListener('click', () => {
  const root = document.documentElement;
  const current = root.getAttribute('data-theme');
  root.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
});

refreshAndRender();
</script>
